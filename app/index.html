<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Going Exponential</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #040506; color: #ece9e2; font: 12px/1.4 ui-monospace, Consolas, monospace; overflow: hidden; }
  #wrap { position: absolute; inset: 0 0 68px 0; display: flex; align-items: center; justify-content: center; }
  #c { max-width: 100%; max-height: 100%; aspect-ratio: 16/9; background: #000; cursor: pointer; }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; height: 68px; padding: 6px 14px; box-sizing: border-box; background: #0a0b0e; border-top: 1px solid #1b1e26; }
  #ui.hidden { display: none; }
  body.nohud #wrap { bottom: 0; }
  #scrub { width: 100%; margin: 0; accent-color: #ffb21e; }
  #marks { position: relative; height: 16px; }
  .mark { position: absolute; top: 0; height: 14px; border-left: 1px solid #ffb21e; color: #8b8f99; font-size: 9px; overflow: hidden; white-space: nowrap; padding-left: 3px; cursor: pointer; box-sizing: border-box; }
  .mark:hover { color: #ece9e2; background: #ffb21e22; }
  #info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #8b8f99; }
  #errs { display: none; position: fixed; top: 8px; left: 8px; right: 8px; max-height: 40vh; overflow: auto; background: #300; color: #fbb; padding: 8px; white-space: pre-wrap; z-index: 9; }
  #start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: #07080bee; z-index: 5; cursor: pointer; }
  #start h1 { font: italic 400 64px 'Serif', Georgia, serif; margin: 0; letter-spacing: 0.01em; }
  #start p { color: #8b8f99; margin: 0; letter-spacing: 0.2em; font-size: 11px; }
  #start .go { margin-top: 18px; color: #ffb21e; font-size: 13px; letter-spacing: 0.3em; border: 1px solid #ffb21e66; padding: 10px 22px; }
  body.export #ui, body.export #errs, body.export #start { display: none !important; }
  body.export #wrap { inset: 0; }
  body.export #c { width: 1920px; height: 1080px; max-width: none; max-height: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ui">
  <div id="marks"></div>
  <input id="scrub" type="range" min="0" value="0" step="0.001" />
  <div id="info">loading…</div>
</div>
<div id="start"><p>A MUSIC VIDEO</p><h1>Going Exponential</h1><div class="go">▶ CLICK TO PLAY</div><p style="margin-top:10px">space play/pause · ←/→ seek · [ ] scenes · f fullscreen · h hide ui</p></div>
<pre id="errs"></pre>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
